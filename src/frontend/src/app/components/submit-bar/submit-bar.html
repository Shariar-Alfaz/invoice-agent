<div class="mt-5 rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
  <p-confirmdialog key="approve-reviewed-edits" appendTo="body" />

  @if (submitted()) {
    <p-message severity="success" variant="outlined" icon="pi pi-check-circle">Invoice submitted to the accounting API successfully.</p-message>
  } @else if (visibleErrors().length > 0) {
    <div class="mb-4 flex flex-col gap-2">
      @for (error of visibleErrors(); track error.raw) {
        <p-message severity="error" variant="outlined" icon="pi pi-exclamation-triangle">
          <button class="review-alert-action" type="button" [disabled]="!error.targetId" (click)="focusErrorTarget(error)">
            <span class="font-semibold">{{ error.title }}</span>
            <span class="text-sm">{{ error.detail }}</span>
          </button>
        </p-message>
      }
    </div>
  }

  <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
    <div>
      <p class="text-sm font-medium text-slate-950">Ready for accounting registration</p>
      <p class="mt-1 text-sm text-slate-600">{{ statusText() }}</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <button
        pButton
        type="button"
        severity="secondary"
        variant="outlined"
        [disabled]="submitting() || !canApprove()"
        (click)="confirmApproveEdits($event)"
      >
        <i class="pi pi-check"></i>
        <span>Approve Edits</span>
      </button>

      <button
        pButton
        type="button"
        severity="success"
        [loading]="submitting()"
        [disabled]="submitting() || !canSubmit()"
        (click)="submitReviewed.emit()"
      >
        <i class="pi pi-send"></i>
        <span>Submit to Accounting</span>
      </button>
    </div>
  </div>
</div>
