<div id="quality-gate" class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
  <div class="flex items-center justify-between gap-3">
    <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-700">Quality Gate</h2>
    <i class="pi pi-shield text-slate-400"></i>
  </div>

  @if (result(); as reviewResult) {
    <div class="mt-5 space-y-3">
      <div class="flex items-center justify-between gap-3">
        <span class="text-sm text-slate-600">Invoice extraction</span>
        <p-tag [value]="confidencePercent(reviewResult.extracted_invoice.extraction_confidence)" [severity]="invoiceConfidenceSeverity()" />
      </div>
      <div class="h-2 overflow-hidden rounded-full bg-slate-100">
        <div class="h-full bg-sky-600" [style.width]="confidencePercent(reviewResult.extracted_invoice.extraction_confidence)"></div>
      </div>

      <div class="flex items-center justify-between gap-3">
        <span class="text-sm text-slate-600">OCR confidence</span>
        <p-tag [value]="confidencePercent(reviewResult.ocr.confidence)" [severity]="ocrConfidenceSeverity()" />
      </div>
      <div class="h-2 overflow-hidden rounded-full bg-slate-100">
        <div class="h-full bg-emerald-600" [style.width]="confidencePercent(reviewResult.ocr.confidence)"></div>
      </div>
    </div>

    @if (isLowConfidence()) {
      <div class="mt-4 rounded-md border border-amber-200 bg-amber-50 p-3 text-sm text-amber-900">
        Low confidence extraction needs reviewer approval before registration.
      </div>
    }
  } @else {
    <div class="mt-5 rounded-md bg-slate-50 px-4 py-4 text-sm text-slate-600">
      No extraction result yet.
    </div>
  }
</div>
